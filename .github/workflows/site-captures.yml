name: Captures HD pour le site
on:
  push:
    branches: [captures-site]
  workflow_dispatch:
jobs:
  shots:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PySide6-Essentials pyqtgraph numpy pyserial imageio-ffmpeg
      - run: python tools/simulate_trk.py sim.trk 120
      - name: Captures HD
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_FONTDIR: C:\Windows\Fonts
          TRACKLAB_VIDEO_SHOTS: "1"
        run: python -m tracklab_qt.main --selftest sim.trk
