name: TrackLab Qt (test + Windows)
on:
  push:
    branches: [feature/wifi-deux-pages]
    paths: ['tracklab_qt/**', 'tracklab/**', 'TrackLab_Qt.py', 'tools/simulate_trk.py', 'installer_qt.iss', '.github/workflows/qt-app.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dependances
        run: python -m pip install PySide6-Essentials pyqtgraph numpy pyserial pyinstaller
      - name: Generer la capture de simulation
        run: python tools/simulate_trk.py sim.trk 120
      - name: "Premiere ouverture (graph)"
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_FONTDIR: C:\Windows\Fonts
          TRACKLAB_FIRST_OPEN: graph
        run: python -m tracklab_qt.main --selftest sim.trk
      - name: "Premiere ouverture (tele)"
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_FONTDIR: C:\Windows\Fonts
          TRACKLAB_FIRST_OPEN: tele
        run: python -m tracklab_qt.main --selftest sim.trk
      - name: Sequences animees pour la video
        if: contains(github.event.head_commit.message, '[sequences]')
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_FONTDIR: C:\Windows\Fonts
          TRACKLAB_VIDEO_FRAMES: "1"
        run: python -m tracklab_qt.main --selftest sim.trk
      - name: Captures haute definition pour la video
        if: contains(github.event.head_commit.message, '[captures]')
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_FONTDIR: C:\Windows\Fonts
          TRACKLAB_VIDEO_SHOTS: "1"
        run: python -m tracklab_qt.main --selftest sim.trk
      - name: Session de demonstration (zoom circuit, tours, comparaison)
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_FONTDIR: C:\Windows\Fonts
          TRACKLAB_DEMO_ONLY: "1"
        run: python -m tracklab_qt.main --selftest sim.trk
      - name: Test sans ecran (captures + chronometrages)
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_FONTDIR: C:\Windows\Fonts
        run: python -m tracklab_qt.main --selftest sim.trk
      - name: Construire
        if: github.event_name == 'workflow_dispatch'
        run: python -m PyInstaller --noconfirm --windowed --icon assets/icon.ico --name TrackLab_Qt --collect-all serial --add-data "tracklab_qt/demo;tracklab_qt/demo" TrackLab_Qt.py
      - name: Taille du dossier
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: '"{0:N0} Mo" -f ((Get-ChildItem dist/TrackLab_Qt -Recurse | Measure-Object Length -Sum).Sum / 1MB)'
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: TrackLab_Qt_Windows
          path: dist/TrackLab_Qt
      - name: Installer Inno Setup
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Construire l'installateur Windows
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer_qt.iss'
      - name: Taille de l'installateur
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: '"{0:N0} Mo" -f ((Get-Item installer/TrackLab_Qt_Setup.exe).Length / 1MB)'
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: TrackLab_Qt_Installateur_Windows
          path: installer/TrackLab_Qt_Setup.exe
