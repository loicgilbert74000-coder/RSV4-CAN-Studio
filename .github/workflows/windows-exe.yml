name: Compiler RSV4 CAN Studio pour Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dependances
        run: python -m pip install pyinstaller pyserial
      - name: Construire le EXE
        run: python -m PyInstaller --noconfirm --onefile --windowed --name RSV4_CAN_Studio --collect-all serial RSV4_CAN_Studio.py
      - uses: actions/upload-artifact@v4
        with:
          name: RSV4_CAN_Studio_Windows_64bits
          path: dist/RSV4_CAN_Studio.exe
