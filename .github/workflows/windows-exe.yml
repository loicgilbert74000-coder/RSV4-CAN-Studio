name: Compiler TrackLab Electronics pour Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dependances
        run: python -m pip install pyinstaller pyserial
      - name: Construire le EXE
        run: python -m PyInstaller --noconfirm --onefile --windowed --name TrackLab_Electronics --collect-all serial RSV4_CAN_Studio.py
      - uses: actions/upload-artifact@v4
        with:
          name: TrackLab_Electronics_Windows_64bits
          path: dist/TrackLab_Electronics.exe

      - name: Installer Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Construire installateur Windows
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: TrackLab_Electronics_Installateur_Windows
          path: installer/TrackLab_Electronics_Setup.exe
