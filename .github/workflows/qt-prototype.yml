name: Prototype Qt (page Courbes)
on:
  push:
    branches: [feature/wifi-deux-pages]
    paths: ['prototype/qt_courbes/**', '.github/workflows/qt-prototype.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: prototype/qt_courbes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dependances
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Test sans ecran (chronometrages + capture)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python main.py --selftest capture_qt.png
      - uses: actions/upload-artifact@v4
        with:
          name: Capture_Qt
          path: prototype/qt_courbes/capture_qt.png
      - name: Construire
        run: python -m PyInstaller --noconfirm --windowed --name TrackLab_Courbes_Qt --add-data "data/sim_courbes.zip;data" main.py
      - name: Taille du dossier
        shell: pwsh
        run: '"{0:N0} Mo" -f ((Get-ChildItem dist/TrackLab_Courbes_Qt -Recurse | Measure-Object Length -Sum).Sum / 1MB)'
      - uses: actions/upload-artifact@v4
        with:
          name: TrackLab_Courbes_Qt_Windows
          path: prototype/qt_courbes/dist/TrackLab_Courbes_Qt
