name: TrackLab Qt (captures pour la video)
on:
  workflow_dispatch:
jobs:
  shots:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dependances
        run: python -m pip install PySide6-Essentials pyqtgraph numpy pyserial
      - name: Generer la capture de simulation
        run: python tools/simulate_trk.py sim.trk 120
      - name: Captures haute definition
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_FONTDIR: C:\Windows\Fonts
          TRACKLAB_VIDEO_SHOTS: "1"
        run: python -m tracklab_qt.main --selftest sim.trk
